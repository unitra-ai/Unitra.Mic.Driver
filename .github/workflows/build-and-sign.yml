name: Build and Sign

# Builds the UnitraMic driver, packs the Partner Center attestation CAB and,
# when the eSigner secrets are configured, signs that CAB with Unitra's
# SSL.com EV code-signing certificate (cloud HSM, no key on the runner).
#
# What this workflow does NOT do: talk to Partner Center. Microsoft's
# attestation signing is a portal upload (Hardware dashboard -> Submit new
# hardware) whose result is downloaded by a human and published with
# scripts/publish-signed-release.ps1 -- see SIGNING.md, "Runbook". The
# Hardware API automation is a follow-up once the first signed release ships.
#
# Toolchain: the GitHub windows-2022 image ships Visual Studio 2022 Enterprise
# with WDK 10.1.26100 AND the WDK Visual Studio extension preinstalled, so no
# chocolatey / VSIX step is needed (the previous version of this file installed
# a second WDK on top and lost portcls.h). Keep the image pinned: the WDK is
# not documented for windows-2025.
#
# Repo configuration (Settings -> Secrets and variables -> Actions):
#   vars.ESIGNER_ENABLED        "true" once the secrets below exist
#   secrets.ES_USERNAME         SSL.com account user name
#   secrets.ES_PASSWORD         SSL.com account password
#   secrets.ES_CREDENTIAL_ID    eSigner signing credential id
#   secrets.ES_TOTP_SECRET      eSigner TOTP secret (unattended OTP)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write   # draft release with the EV-signed CAB on tags

jobs:
  build:
    runs-on: windows-2022
    outputs:
      driver-ver: ${{ steps.stage.outputs.driver-ver }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show WDK on this image
        shell: pwsh
        run: |
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory |
            ForEach-Object { Write-Host "SDK/WDK include: $($_.Name)" }
          $km = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include\*\km\portcls.h' -ErrorAction SilentlyContinue
          if (-not $km) { Write-Host '::error::portcls.h not found: this image has no WDK'; exit 1 }
          $km | ForEach-Object { Write-Host "portcls.h: $($_.FullName)" }

      - name: Build driver (Release|x64)
        shell: pwsh
        run: pwsh scripts/build-release.ps1 -Platform x64

      - name: Stage package
        id: stage
        shell: pwsh
        run: |
          $pkg = 'x64\Release\package'
          Get-ChildItem $pkg
          $ver = (Select-String -Path "$pkg\VirtualAudioDriver.inf" -Pattern '^\s*DriverVer\s*=\s*(.+)$' | Select-Object -First 1).Matches[0].Groups[1].Value.Trim()
          Write-Host "DriverVer: $ver"
          "driver-ver=$ver" >> $env:GITHUB_OUTPUT

      - name: Pack attestation CAB
        shell: pwsh
        run: pwsh scripts/make-attestation-cab.ps1 -OutDir dist

      - name: Upload unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: UnitraMic-unsigned-x64
          path: |
            x64/Release/package/VirtualAudioDriver.sys
            x64/Release/package/VirtualAudioDriver.inf
            x64/Release/package/virtualaudiodriver.cat
            x64/Release/VirtualAudioDriver.pdb

      - name: Upload attestation CAB (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: UnitraMic-attestation-cab-unsigned
          path: dist/UnitraMic.cab

  sign:
    # EV-sign the CAB with eSigner. Never on fork PRs (no secrets there), and
    # only once the repo variable says the secrets exist, so the pipeline is
    # safe to merge before the certificate is wired in.
    needs: build
    if: github.event_name != 'pull_request' && vars.ESIGNER_ENABLED == 'true'
    runs-on: windows-2022
    steps:
      - name: Download CAB
        uses: actions/download-artifact@v4
        with:
          name: UnitraMic-attestation-cab-unsigned
          path: cab

      - name: Sign CAB with SSL.com eSigner (EV)
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/cab/UnitraMic.cab
          output_path: ${{ github.workspace }}/signed
          malware_block: false
          environment_name: PROD

      - name: Verify EV signature
        shell: pwsh
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName verify /pa /v signed\UnitraMic.cab
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload EV-signed CAB
        uses: actions/upload-artifact@v4
        with:
          name: UnitraMic-attestation-cab-evsigned
          path: signed/UnitraMic.cab

      # On a tag, park the EV-signed CAB on a DRAFT release so the operator
      # has one place to fetch it from for the Partner Center upload. The
      # release is published (and the Microsoft-signed asset attached) by
      # scripts/publish-signed-release.ps1 after attestation comes back.
      - name: Draft release with the submission CAB
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: UnitraMic ${{ github.ref_name }}
          body: |
            Attestation submission for INF DriverVer ${{ needs.build.outputs.driver-ver }}.

            `UnitraMic-submission.cab` is EV-signed and ready for Partner Center
            (Hardware -> Submit new hardware). After Microsoft returns the signed
            package, run `scripts/publish-signed-release.ps1 -SignedZip <download> -Tag ${{ github.ref_name }}`
            to verify it (signtool /kp) and attach `UnitraMic-signed-x64.zip`.
          files: signed/UnitraMic.cab

      - name: Next step
        shell: pwsh
        run: |
          Write-Host '::notice::EV-signed CAB ready. Upload it at https://partner.microsoft.com/dashboard/hardware/Search (Submit new hardware), select Windows 10 x64 (19041+) and Windows 11 x64, no test-signing options. Then publish the returned package with scripts/publish-signed-release.ps1.'
